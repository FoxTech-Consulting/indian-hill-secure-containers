# Credentials and PKI are supplied at deployment; absence prevents startup.
bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tls-cert-file /run/redis-secrets/server.crt
tls-key-file /run/redis-secrets/server.key
tls-ca-cert-file /run/redis-secrets/ca.crt
tls-auth-clients yes
tls-protocols "TLSv1.2 TLSv1.3"
tls-replication yes
tls-cluster yes
aclfile /run/redis-secrets/users.acl
daemonize no
supervised no
logfile ""
loglevel notice
dir /data
appendonly yes
appendfsync everysec
stop-writes-on-bgsave-error yes
maxmemory 256mb
maxmemory-policy noeviction
maxclients 100
timeout 300
tcp-keepalive 60
enable-protected-configs no
enable-debug-command no
enable-module-command no
