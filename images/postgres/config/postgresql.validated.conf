# Validated retains the Hardened configuration and is linked to the FIPS
# provider. Production deployments must enable TLS from protected certificate
# mounts; the image deliberately contains neither a private key nor a CA trust
# decision.
listen_addresses = '*'
port = 5432
max_connections = 100
password_encryption = 'scram-sha-256'
hba_file = '/opt/ihl/postgresql/pg_hba.hardened.conf'
ident_file = '/opt/ihl/postgresql/pg_ident.conf'
log_destination = 'stderr'
logging_collector = off
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] user=%u,db=%d,app=%a,client=%h '
log_timezone = 'UTC'
timezone = 'UTC'
ssl = off
