# Hardened policy retains the Secure baseline and admits only SCRAM-protected
# database connections. TLS certificates and their private key are supplied by
# the protected deployment overlay, rather than being embedded in an image.
listen_addresses = '*'
port = 5432
max_connections = 100
password_encryption = 'scram-sha-256'
hba_file = '/opt/ihl/postgresql/pg_hba.hardened.conf'
ident_file = '/opt/ihl/postgresql/pg_ident.conf'
log_destination = 'stderr'
logging_collector = off
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] user=%u,db=%d,app=%a,client=%h '
log_timezone = 'UTC'
timezone = 'UTC'
# The protected deployment overlay sets ssl=on plus a certificate/key from its
# secret store. This candidate image never ships a TLS private key.
ssl = off
