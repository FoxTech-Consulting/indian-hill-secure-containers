# Reviewed baseline for the Indian Hill PostgreSQL container. This immutable
# file is selected by the rootless launcher; the cluster's generated config is
# never the authority for image policy.
listen_addresses = '*'
port = 5432
max_connections = 100
password_encryption = 'scram-sha-256'
hba_file = '/opt/ihl/postgresql/pg_hba.secure.conf'
ident_file = '/opt/ihl/postgresql/pg_ident.conf'
log_destination = 'stderr'
logging_collector = off
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] user=%u,db=%d,app=%a,client=%h '
log_timezone = 'UTC'
timezone = 'UTC'
ssl = off
